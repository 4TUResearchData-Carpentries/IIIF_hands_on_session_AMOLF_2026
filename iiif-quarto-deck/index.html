## Downloading the files should not be the **only** way to explore visual research data.


### Download first

- Find a file in a dataset record
- Download the original image
- Open it in suitable software




### Explore first

- Open a standard web link
- Zoom and inspect the image
- Decide whether to download or reuse


::: {.bottom-line}
IIIF complements file downloads — it does not replace them.
:::


## What is IIIF?

::: {.definition}
**IIIF = International Image Interoperability Framework**

An open set of web standards that allows repositories, libraries, archives, museums, and research services to publish images in a way that many tools can understand.
:::

::: {.question-grid}
::: {.question-item .fragment}
<span class="question-number">01</span>

How can I inspect a **very large image** in a browser?
:::

::: {.question-item .fragment}
<span class="question-number">02</span>

How can I request a **region, size, or zoom level**?
:::

::: {.question-item .fragment}
<span class="question-number">03</span>

How do I describe a **sequence or collection** of images?
:::

::: {.question-item .fragment}
<span class="question-number">04</span>

How can I **compare or annotate** images from different sources?
:::
:::


## Two IIIF APIs work together

::: {.api-pair}
::: {.api-column}
<span class="overline">Retrieving visual content</span>

### Image API

Standard requests for a particular version of an image.

::: {.api-actions}
<span>Thumbnail</span><span>Crop / region</span><span>Resize / deep zoom</span>
:::
:::

::: {.api-join}
<span aria-hidden="true">+</span>
:::

::: {.api-column}
<span class="overline">Describing visual content</span>

### Presentation API

A **manifest** describing which images belong together and how to display them.

::: {.api-actions}
<span>Labels & order</span><span>Metadata</span><span>Image-service links</span>
:::
:::
:::

::: {.bottom-line}
**Image API:** *give me the pixels.* &nbsp; **Presentation API:** *tell me what I am looking at.*
:::

## From a dataset to an IIIF viewer

::: {.steps-horizontal}
::: {.step-item}
<span class="step-number">1</span>

### Find

Open a dataset page on 4TU.ResearchData.
:::

::: {.step-arrow}
→
:::

::: {.step-item}
<span class="step-number">2</span>

### Copy

Copy the **IIIF Manifest** URL under *Interoperability*.
:::

::: {.step-arrow}
→
:::

::: {.step-item}
<span class="step-number">3</span>

### Explore

Paste the manifest URL into an IIIF-compatible viewer.
:::
:::

::: {.emphasis-statement}
One standard URL can open the same dataset in multiple compatible tools.
:::


## What can you do with a manifest?

::: {.capabilities}
::: {.capability .fragment}
<span class="capability-glyph">↗</span>

**Open** images in external viewers
:::

::: {.capability .fragment}
<span class="capability-glyph">⌕</span>

**Zoom & pan** through large images
:::

::: {.capability .fragment}
<span class="capability-glyph">⇄</span>

**Compare** images across datasets
:::

::: {.capability .fragment}
<span class="capability-glyph">⌁</span>

**Share & embed** image views
:::

::: {.capability .fragment}
<span class="capability-glyph">✎</span>

**Annotate** in supporting tools
:::

::: {.capability .fragment}
<span class="capability-glyph">◇</span>

**Connect** to specialised workflows
:::
:::

::: {.bottom-line}
Some capabilities depend on the viewer, manifest structure, and available metadata.
:::


## Different tools, same standard

::: {.tool-groups}
::: {.tool-group}
<span class="overline">View, browse & compare</span>

- [Mirador](https://projectmirador.org/) — multi-image comparison and annotation
- [Universal Viewer](https://universalviewer.io/) — general-purpose IIIF viewer
- [Clover IIIF](https://samvera-labs.github.io/clover-iiif/) — Presentation API viewer
:::

::: {.tool-group}
<span class="overline">Build & enrich</span>

- [Annona](https://ncsu-libraries.github.io/annona/) — web display and annotations
- [OpenSeadragon](https://openseadragon.github.io/) — deep-zoom image viewing
- [Allmaps](https://allmaps.org/) — georeferencing IIIF maps
- [Digirati Manifest Editor](https://manifest-editor.digirati.services/) — inspect and edit manifests
:::
:::

::: {.bottom-line}
Not every viewer supports every IIIF feature: choose the tool that fits your workflow.
:::


## What benefits does IIIF bring?

::: {.benefit-triad}
::: {.benefit-block}
<span class="benefit-number">01</span>

### Discover

**Preview before downloading** and understand the contents of large or numerous image files.
:::

::: {.benefit-block}
<span class="benefit-number">02</span>

### Inspect

**Deep zoom, compare, and navigate** images without moving entire datasets.
:::

::: {.benefit-block}
<span class="benefit-number">03</span>

### Reuse

**Share, embed, annotate, and connect** images to established research tools.
:::
:::

::: {.small-note}
Manifests can also carry labels, sequence order, and links to the originating dataset record.
:::


## When is IIIF especially useful?

::: {.lead}
Whenever **visual inspection** is an important step in understanding the dataset.
:::

::: {.usecases}
::: {.usecase}
<span class="usecase-mark">01</span>

**High-resolution microscopy**

<span class="muted">Explore fine detail at different zoom levels</span>
:::

::: {.usecase}
<span class="usecase-mark">02</span>

**Maps, scans & drawings**

<span class="muted">Compare and inspect spatial or historical resources</span>
:::

::: {.usecase}
<span class="usecase-mark">03</span>

**Image sequences & time series**

<span class="muted">Keep multiple images in a structured order</span>
:::

::: {.usecase}
<span class="usecase-mark">04</span>

**Collections for teaching & analysis**

<span class="muted">Enable annotation and reuse across platforms</span>
:::
:::


## The first requirement: expose the files

::: {.lead}
IIIF works best when images can be accessed **individually**, not only as files hidden inside an archive.
:::

::: {.file-choice}
::: {.file-good}
<span class="overline">Recommended for IIIF access</span>

### Individual image files

<span class="format-chips"><span>TIFF</span><span>JPEG</span><span>PNG</span><span>JPEG 2000</span><span>PDF*</span></span>

<span class="file-explain">Each image can be addressed, inspected, and served separately.</span>
:::

::: {.file-bad}
<span class="overline">Avoid as the only deposit</span>

### ZIP-only image collection

<span class="zip-label">images.zip</span>

<span class="file-explain">Files inside a ZIP cannot be served individually through IIIF in the same way.</span>
:::
:::

::: {.small-note}
*PDF support depends on the ability to render or expose its pages as images. You can provide a ZIP for convenience **alongside** separately exposed files.
:::


## Good practices for depositing images

::: {.checklist-columns}
::: {.checklist-column}
- [x] Deposit the relevant images as **individual files**.
- [x] Use **clear, consistent filenames**, especially for sequences.
- [x] Include a **README** describing content, provenance, and research context.
:::

::: {.checklist-column}
- [x] Provide useful metadata: **scale, sample, time, location, instrument**, when applicable.
- [x] Prefer **open, well-documented formats**.
- [x] Check the images **open in standard software** before depositing.
:::
:::

::: {.bottom-line}
Better documentation and metadata make the resulting IIIF manifest more useful.
:::


## What IIIF does *not* do

::: {.limitations}
::: {.limitation}
<span>×</span> Change the scientific content of the files
:::
::: {.limitation}
<span>×</span> Validate scientific correctness or data quality
:::
::: {.limitation}
<span>×</span> Replace a README, methods, or domain-specific metadata
:::
::: {.limitation}
<span>×</span> Automatically support every proprietary image format
:::
::: {.limitation}
<span>×</span> Replace licensing or access-condition decisions
:::
:::

::: {.bottom-line}
IIIF is an **additional interoperability layer**, not a substitute for good research data management.
:::

            const link = links[i];
            if (!isInternal(link.href)) {
              // undo the damage that might have been done by quarto-nav.js in the case of
              // links that we want to consider external
              if (link.dataset.originalHref !== undefined) {
                link.href = link.dataset.originalHref;
              }
                // target, if specified
                link.setAttribute("target", "_blank");
                if (link.getAttribute("rel") === null) {
                  link.setAttribute("rel", "noopener");
                }
            }
          }
        function tippyHover(el, contentFn, onTriggerFn, onUntriggerFn) {
          const config = {
            allowHTML: true,
            maxWidth: 500,
            delay: 100,
            arrow: false,
            appendTo: function(el) {
                return el.closest('section.slide') || el.parentElement;
            },
            interactive: true,
            interactiveBorder: 10,
            theme: 'light-border',
            placement: 'bottom-start',
          };
          if (contentFn) {
            config.content = contentFn;
          }
          if (onTriggerFn) {
            config.onTrigger = onTriggerFn;
          }
          if (onUntriggerFn) {
            config.onUntrigger = onUntriggerFn;
          }
            config['offset'] = [0,0];
            config['maxWidth'] = 700;
          window.tippy(el, config); 
        }
        const noterefs = window.document.querySelectorAll('a[role="doc-noteref"]');
        for (var i=0; i<noterefs.length; i++) {
          const ref = noterefs[i];
          tippyHover(ref, function() {
            // use id or data attribute instead here
            let href = ref.getAttribute('data-footnote-href') || ref.getAttribute('href');
            try { href = new URL(href).hash; } catch {}
            const id = href.replace(/^#\/?/, "");
            const note = window.document.getElementById(id);
            if (note) {
              return note.innerHTML;
            } else {
              return "";
            }
          });
        }
        const findCites = (el) => {
          const parentEl = el.parentElement;
          if (parentEl) {
            const cites = parentEl.dataset.cites;
            if (cites) {
              return {
                el,
                cites: cites.split(' ')
              };
            } else {
              return findCites(el.parentElement)
            }
          } else {
            return undefined;
          }
        };
        var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
        for (var i=0; i<bibliorefs.length; i++) {
          const ref = bibliorefs[i];
          const citeInfo = findCites(ref);
          if (citeInfo) {
            tippyHover(citeInfo.el, function() {
              var popup = window.document.createElement('div');
              citeInfo.cites.forEach(function(cite) {
                var citeDiv = window.document.createElement('div');
                citeDiv.classList.add('hanging-indent');
                citeDiv.classList.add('csl-entry');
                var biblioDiv = window.document.getElementById('ref-' + cite);
                if (biblioDiv) {
                  citeDiv.innerHTML = biblioDiv.innerHTML;
                }
                popup.appendChild(citeDiv);
              });
              return popup.innerHTML;
            });
          }
        }
      });
      </script>
